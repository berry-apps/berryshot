name: Deploy to Self-hosted Runner

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Build macOS Binaries (Optional)
        run: |
          if command -v swift >/dev/null 2>&1; then
            echo "✅ Swift compiler found. Compiling macOS app and packaging DMG/Zip..."
            chmod +x build_app.sh
            ./build_app.sh
          else
            echo "⚠️ Swift compiler not found on this agent. Skipping binary compilation."
            echo "Deploying with pre-existing binaries inside landingpage/assets/ directory."
          fi

      - name: Verify Landing Page Code
        run: |
          echo "Validating landing page HTML components..."
          test -f landingpage/berryshot/index.html
          test -f landingpage/berryshot/docs.html
          test -d landingpage/berryshot/assets
          test -f landingpage/notex/index.html
          echo "✅ HTML files and assets directory verified."
          
      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Generate SEO Assets
        run: |
          echo "Generating dynamic sitemap.xml and robots.txt for SEO..."
          uv run landingpage/berryshot/generate_sitemap.py https://notex.work

      - name: Deploy locally to Webroot
        env:
          BERRYSHOT_DIR: /var/www/berryshot
          NOTEX_DIR: /var/www/notex
          DAUTAY_DIR: /var/www/dautay
        run: |
          echo "Deploying landing pages directly to local directories..."
          
          echo "--- Build Environment Diagnostics ---"
          echo "Running on host: $(hostname)"
          echo "Running as user: $(whoami)"
          echo "Current directory: $(pwd)"
          
          mkdir -p $BERRYSHOT_DIR
          mkdir -p $NOTEX_DIR
          mkdir -p $DAUTAY_DIR
          
          echo "Deploying Berryshot..."
          rsync -av --delete \
            --exclude='.DS_Store' \
            --exclude='.git*' \
            landingpage/berryshot/ $BERRYSHOT_DIR/
            
          echo "Deploying Notex Ecosystem..."
          rsync -av --delete \
            --exclude='.DS_Store' \
            --exclude='.git*' \
            landingpage/notex/ $NOTEX_DIR/

          echo "Deploying Dâu Tây..."
          if [ -d "landingpage/dautay/dist" ]; then
            rsync -av --delete \
              --exclude='.DS_Store' \
              --exclude='.git*' \
              landingpage/dautay/dist/ $DAUTAY_DIR/
          else
            echo "⚠️ Thư mục landingpage/dautay/dist không tồn tại. Bỏ qua deploy Dâu Tây."
          fi
          
          echo "✅ Local deployments completed successfully."
